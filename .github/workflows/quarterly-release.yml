name: Deploy Quarterly Release Snapshot

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    env:
      REACT_APP_DOCIT_GITHUB_TOKEN: ${{ secrets.REACT_APP_DOCIT_GITHUB_TOKEN }}
      DEV_DEPLOY_TOKEN: ${{ secrets.DEV_DEPLOY_TOKEN }}
      repository-name: ${{ github.event.inputs.environment == 'prod' && 'brightlayer-ui/brightlayer-ui.github.io' || 'brightlayer-ui-dev/brightlayer-ui-dev.github.io' }}
      ga-id: ${{ github.event.inputs.environment == 'prod' && 'ga:prod' || 'ga:dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - run: yarn --immutable
      - run: yarn ${{ env.ga-id }}

      - name: Read design version from package.json
        id: pkg-version
        run: echo "design=v$(node -p "require('./package.json').designVersion")" >> "$GITHUB_OUTPUT"

      # Latest is served from both root (so "/" always mirrors the newest release) and its own
      # stable /vN/ folder (so the permalink still works once a newer version takes over root).
      # Each destination needs its own build since PUBLIC_URL is baked into the JS bundle and router basename.
      - name: Build root copy (latest)
        run: PUBLIC_URL="/" yarn build
      - name: Stage root copy
        run: |
          mkdir -p deploy
          cp -r build/. deploy/

      - name: Build versioned copy
        run: PUBLIC_URL="/${{ steps.pkg-version.outputs.design }}" yarn build
      - name: Stage versioned copy
        run: |
          mkdir -p "deploy/${{ steps.pkg-version.outputs.design }}"
          cp -r build/. "deploy/${{ steps.pkg-version.outputs.design }}/"

      - name: Deploy quarterly snapshot
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          token: ${{ env.DEV_DEPLOY_TOKEN }}
          repository-name: ${{ env.repository-name }}
          branch: master
          clean: false
          git-config-name: Brightlayer UI Agent
          git-config-email: brightlayer-ui@eaton.com
          commit-message: "Deploy design ${{ steps.pkg-version.outputs.design }} snapshot (root + versioned) to ${{ github.event.inputs.environment }} (${{ github.sha }})"

      # Keep only the 3 most recent /vN/ snapshot folders; older ones are removed so the hosting repo doesn't grow unbounded.
      - name: Clean up old version snapshots
        run: |
          git clone --depth=1 "https://${{ env.DEV_DEPLOY_TOKEN }}@github.com/${{ env.repository-name }}.git" hosting-repo
          cd hosting-repo
          # grep restricts matches to exactly "v" + digits (v1..v50+); sort -n handles any digit count numerically, not lexically.
          versions=$(find . -maxdepth 1 -type d -name 'v*' -printf '%f\n' | grep -E '^v[0-9]+$' | sort -t v -k2 -n -r)
          remove=$(echo "$versions" | tail -n +4)
          if [ -z "$remove" ]; then
            echo "3 or fewer version snapshots present, nothing to clean up."
            exit 0
          fi
          git config user.name "Brightlayer UI Agent"
          git config user.email "brightlayer-ui@eaton.com"
          for v in $remove; do
            git rm -r --ignore-unmatch "$v"
          done
          git commit -m "Clean up old design version snapshots (keep latest 3)"
          git push origin master
